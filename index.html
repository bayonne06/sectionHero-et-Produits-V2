<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css" />

    <title>
        Covoiturage, Bus ou Train, Allez partout à pétit prix | BlaBlaCar
    </title>
</head>

<body>
    <header>
        <p><span class="material-icons logo">commute</span> BlaBlaCar</p>
        <nav>
            <ul>
                <li><a href="">Covoiturage</a></li>
                <li><a href="">Bus</a></li>
                <li><a href="">Train</a></li>
            </ul>

            <ul>
                <li><a href="#retour"><span class="material-icons">search</span></a></li>
                <li><a href="#depart">Proposer un trajet</a></li>
                <li>
                    <button"><span class="material-icons">language</span></button>
                </li>
                <li>
                    <button><span class="material-icons">person</span> </button>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <div>
                <h1>Bus, train, covoiturage : BlaBlaCar vous emmène où vous voulez.</h1>
                <img src="" alt="" height="348px" width="612px" />
            </div>

        </section>

        <section>

            <form action="">
                <fieldset>
                    <label for="depart">Départ</label>
                    <input id="depart" type="text" placeholder="Ville, gare, lieu">
                    <label for="destination">Destination</label>
                    <input id="destination" type="text" placeholder="Ville, gare, lieu">
                    <label for="date">Date</label>
                    <input id="date" type="date">
                    <label for="retour">Retour</label>
                    <input id="retour" type="date" placeholder="Optionnel">

                    <input type="">
                    <button type="submit">Rechercher</button>
                </fieldset>
            </form>
        </section>

        <section>
            <h2>Le meilleur (prix) en bus</h2>
            <article>
                <img src="" alt="" height="348px" width="612px" />
                <div>
                    <span></span>
                    <span>Marché Total <br> Mapassi</span>
                </div>
                <p>Dès</p>
                <div>
                    <span>150 FCFA</span>
                    <span></span>
                </div>
                <p>Mapassi depuis</p>
                <div>
                    <span>150 FCFA</span>
                    <span class="material-icons"> chevron_right</span>
                </div>
            </article>
        </section>
    </main>
</body>

</html>
